<div id="game">

  <div id="hud">
    <span>🔴 СЧЁТ: <b id="score">0</b></span>
    <span>🏆 РЕКОРД: <b id="best">0</b></span>
  </div>

  <div id="player"></div>

  <div id="startScreen">
    <h1>RED RUSH</h1>
    <p>Набери 100 очков и победи!</p>
    <button id="startBtn">ИГРАТЬ</button>
  </div>

  <div id="endScreen">
    <h2 id="resultTitle">GAME OVER</h2>
    <p>Счёт: <b id="finalScore">0</b></p>
    <button id="againBtn">ЕЩЁ РАЗ</button>
  </div>

  <div id="buttons">
    <button id="leftBtn">◀</button>
    <button id="rightBtn">▶</button>
  </div>

</div>
