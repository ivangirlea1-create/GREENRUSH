<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GREEN RUSH</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <div id="hud">
      <span>🟢 СЧЁТ: <b id="score">0</b></span>
      <span>🏆 РЕКОРД: <b id="best">0</b></span>
    </div>

    <div id="player"></div>

    <div id="startScreen">

      <h1>GREEN RUSH</h1>

      <p>
        Набери 100 очков и победи!
      </p>

      <button id="startBtn">
        ИГРАТЬ
      </button>

    </div>

    <div id="endScreen">

      <h2 id="resultTitle">
        GAME OVER
      </h2>

      <p>
        Счёт:
        <b id="finalScore">0</b>
      </p>

      <button id="againBtn">
        ЕЩЁ РАЗ
      </button>

    </div>

    <div id="buttons">

      <button id="leftBtn">
        ◀
      </button>

      <button id="rightBtn">
        ▶
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
